version: "3.9"

services:
  app:
    build: .
    container_name: task-manager

    ports:
      - "8080:8080"

    environment:
      REDIS_ADDR: redis:6379

    depends_on:
      - redis

  redis:
  image: redis:7-alpine

  container_name: redis

  ports:
    - "6379:6379"

  volumes:
    - redis-data:/data